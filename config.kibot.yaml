kibot:
  version: 1

preflight:
  erc: true
  drc: true
  check_zone_fills: true

filters:
  - name: only_jlc_parts
    comment: "Only parts with LCSC field"
    type: generic
    include_only:
      - column: "LCSC"
        regex: '^C\d+'
  - name: exclude_jlc_parts
    comment: "Exclude parts with LCSC field"
    type: generic
    exclude_any:
      - column: "LCSC"
        regex: '^C\d+'

outputs:
  # Schematic outputs
  - name: "schematic_pdf"
    comment: "Print schematic (PDF)"
    type: pdf_sch_print
    dir: output/schematics
    options:
      output: "%p-Schematic.%x"

  - name: "schematic_svg"
    comment: "Print schematic (SVG)"
    type: svg_sch_print
    dir: output/schematics
    options:
      output: "%p-Schematic.%x"

  # PCB outputs
  - name: "gerbers"
    comment: "Gerber files"
    type: gerber
    dir: output/gerbers
    layers:
      - layer: F.Cu
        suffix: F_Cu
      - layer: B.Cu
        suffix: B_Cu
      - layer: F.SilkS
        suffix: F_SilkS
      - layer: B.SilkS
        suffix: B_SilkS
      - layer: F.Mask
        suffix: F_Mask
      - layer: B.Mask
        suffix: B_Mask
      - layer: F.Paste
        suffix: F_Paste
      - layer: B.Paste
        suffix: B_Paste
      - layer: Edge.Cuts
        suffix: Edge_Cuts

  - name: "drill"
    comment: "Drill files"
    type: excellon
    dir: output/gerbers
    options:
      output: "%p-drill.%x"

  - name: "position_jlc"
    comment: "Pick and place file for JLC (SMD only)"
    type: position
    dir: output/assembly
    options:
      format: CSV
      units: millimeters
      separate_files_for_front_and_back: false
      only_smd: true
      output: "%f_cpl_jlc.%x"
      columns:
        - id: Ref
          name: Designator
        - Val
        - Package
        - id: PosX
          name: "Mid X"
        - id: PosY
          name: "Mid Y"
        - id: Rot
          name: Rotation
        - id: Side
          name: Layer

  - name: "position_all"
    comment: "Complete pick and place file (all components)"
    type: position
    dir: output/assembly
    options:
      format: CSV
      units: millimeters
      separate_files_for_front_and_back: false
      only_smd: false
      output: "%f_position_all.%x"

  - name: "bom"
    comment: "BoM for JLC"
    type: bom
    dir: output/bom
    options:
      output: "%f_bom_jlc.%x"
      ref_separator: ","
      columns:
        - field: Value
          name: Comment
        - field: References
          name: Designator
        - Footprint
        - field: "LCSC"
          name: "LCSC Part Number"
      csv:
        hide_pcb_info: true
        hide_stats_info: true
        quote_all: true

  - name: bom_manual
    comment: "BoM for Digikey and Mouser"
    type: bom
    dir: output/bom
    filter: exclude_jlc_parts
    options:
      output: "%f_bom_mouser_digikey.%x"
      ref_separator: ","
      columns:
        - Row
        - Description
        - Reference
        - Qty
        - Value
        - MPN
        - Footprint
      group_by: [MPN]

  - name: "bom_octopart"
    comment: "BOM formatted for 1-click Octopart import"
    type: bom
    dir: output/bom
    filter: exclude_jlc_parts # Keep only your manual-buy THT parts
    options:
      output: "%f_bom_octopart.%x"
      # Octopart recognizes 'mpn' and 'quantity' headers automatically
      columns:
        - field: MPN
          name: "mpn"
        - field: Qty
          name: "quantity"
        - field: Reference
          name: "designator"
        - field: Value
          name: "description"
      csv:
        hide_pcb_info: true
        hide_stats_info: true

  - name: "ibom"
    comment: "Interactive HTML BOM"
    type: ibom
    dir: output/assembly
    options:
      extra_fields: ["LCSC", "MPN"] # Show these in the web view
      output: "%p-ibom.html"

  - name: "pcb_top_pdf"
    comment: "PCB top view (PDF)"
    type: pcb_print
    dir: output/pcb
    options:
      output: "%p-top.%x"
      format: PDF
      pages:
        - layers:
            - layer: F.Cu
            - layer: F.SilkS
            - layer: F.Mask
            - layer: Edge.Cuts

  - name: "pcb_bottom_pdf"
    comment: "PCB bottom view (PDF)"
    type: pcb_print
    dir: output/pcb
    options:
      output: "%p-bottom.%x"
      format: PDF
      pages:
        - layers:
            - layer: B.Cu
            - layer: B.SilkS
            - layer: B.Mask
            - layer: Edge.Cuts
          mirror: true

  - name: "step"
    comment: "3D model (STEP format)"
    type: step
    dir: output/3d
    options:
      output: "%p.%x"

  - name: "vrml"
    comment: "3D model (VRML format)"
    type: vrml
    dir: output/3d
    options:
      output: "%p.%x"
